<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <button id="new-session" class="new-button">新对话</button>
      <ul id="session-list"></ul>
    </aside>
    <main class="chat">
      <div id="messages"></div>
      <form id="chat-form">
        <input id="message-input" autocomplete="off" placeholder="输入消息，回车发送" />
        <button type="submit">发送</button>
      </form>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
