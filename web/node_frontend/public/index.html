<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <div class="brand-name">AI Agent</div>
          <div class="brand-sub">DeepSeek · MCP</div>
        </div>
      </div>
      <button id="new-session" class="new-button">
        <span class="plus">＋</span> 新对话
      </button>
      <div class="section-title">会话历史</div>
      <ul id="session-list"></ul>
    </aside>
    <main class="chat">
      <header class="chat-header">
        <div>
          <h1>AI 助手</h1>
          <div class="chat-subtitle">基于 DeepSeek，可使用 MCP 工具</div>
        </div>
        <div class="online-dot" title="在线"></div>
      </header>
      <div id="messages"></div>
      <form id="chat-form">
        <input
          id="message-input"
          autocomplete="off"
          placeholder="输入消息，按 Enter 发送"
        />
        <button type="submit" aria-label="发送">↑</button>
      </form>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
